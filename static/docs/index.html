<html lang="uk">
<head>
<meta charset="utf-8">

<title>наСлух — документація</title>
<style>
:root { --bg: #f6f6f7; --card: #fff; --text: #1d1d1f; --text2: #555; --accent: #0a84ff; --sep: #e2e2e5; }
@media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --card: #2a2a2d; --text: #f2f2f7; --text2: #b0b0b5; --accent: #4aa3ff; --sep: #3a3a3d; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 40px 20px 60px; }
h1 { font-size: 28px; margin: 0 0 20px; letter-spacing: -.02em; }
a.card { display: block; background: var(--card); border: 1px solid var(--sep); border-radius: 12px; padding: 16px 18px;
  margin: 10px 0; color: var(--text); text-decoration: none; }
a.card:hover { border-color: var(--accent); }
a.card b { color: var(--accent); }
a.card span { color: var(--text2); font-size: 14px; }
</style>
</head>
