<style>
:root {
  color-scheme: light dark;
  --window: #ffffff;
  --sidebar: #e9e8ed;
  --toolbar: rgba(250,250,252,.86);
  --text: #1d1d1f;
  --text2: #6e6e73;
  --text3: #a1a1a6;
  --sep: rgba(0,0,0,.1);
  --hover: rgba(0,0,0,.045);
  --side-sel: rgba(0,0,0,.09);
  --accent: #007aff;
  --accent-soft: rgba(0,122,255,.12);
  --green: #28a745; --green-soft: rgba(52,199,89,.16);
  --orange: #f08c00; --orange-soft: rgba(255,149,0,.16);
  --purple: #9f45d6; --purple-soft: rgba(175,82,222,.15);
  --red: #ff3b30; --red-soft: rgba(255,59,48,.12);
  --card: #f5f5f7;
  --field: #ffffff;
  --field-border: rgba(0,0,0,.14);
  --wave: rgba(60,60,67,.28);
  --shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 10px 40px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --window: #1e1e1e;
    --sidebar: #2b2a2e;
    --toolbar: rgba(38,38,40,.86);
    --text: #f5f5f7;
    --text2: #98989d;
    --text3: #636366;
    --sep: rgba(255,255,255,.1);
    --hover: rgba(255,255,255,.05);
    --side-sel: rgba(255,255,255,.1);
    --accent: #0a84ff;
    --accent-soft: rgba(10,132,255,.2);
    --green: #30d158; --green-soft: rgba(48,209,88,.18);
    --orange: #ff9f0a; --orange-soft: rgba(255,159,10,.18);
    --purple: #bf5af2; --purple-soft: rgba(191,90,242,.2);
    --red: #ff453a; --red-soft: rgba(255,69,58,.18);
    --card: #2a2a2c;
    --field: #1c1c1e;
    --field-border: rgba(255,255,255,.14);
    --wave: rgba(235,235,245,.25);
    --shadow: 0 0 0 .5px rgba(255,255,255,.15), 0 10px 40px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--window);
  color: var(--text);
  font: 13px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; }
svg { display: block; }
.app { display: grid; grid-template-columns: 64px 230px 360px 1fr; height: 100vh; }
/* ---------- смужка агента ---------- */
.rail { background: var(--sidebar); border-right: 1px solid var(--sep); display: flex; flex-direction: column; align-items: center; padding: 14px 0 10px; gap: 6px; min-height: 0; filter: brightness(.97); }
@media (prefers-color-scheme: dark) { .rail { filter: brightness(.88); } }
.rail .ag { position: relative; width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(160deg,#a78bfa,#6d4aff); color: #fff; display: grid; place-items: center; }
.rail .ag .sd { position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--sidebar); background: var(--text3); }
.rail .ag .sd.idle { background: var(--green); }
.rail .ag .sd.working, .rail .ag .sd.compacting { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.rail .ag .sd.error { background: var(--red); }
@keyframes pulse { 50% { opacity: .35; } }
.rail .lbl { font-size: 10px; color: var(--text3); font-weight: 600; text-align: center; line-height: 1.2; }
.rail .num { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 6px; }
.rail .bar { width: 10px; flex: 1; max-height: 220px; min-height: 60px; border-radius: 5px; background: var(--hover); position: relative; overflow: hidden; margin: 2px 0; box-shadow: inset 0 0 0 .5px var(--sep); }
.rail .bar i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 5px; background: var(--green); transition: height .4s, background .4s; }
.rail .rst { font-size: 10px; color: var(--text2); text-align: center; min-height: 26px; padding: 0 4px; line-height: 1.25; }
.rail button { border: 0; background: transparent; color: var(--text2); border-radius: 8px; width: 52px; padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; cursor: default; }
.rail button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.rail button:disabled { opacity: .35; }
.rail .grow { flex: 1; }

/* ---------- бокова панель ---------- */
.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--sep);
  display: flex; flex-direction: column; min-height: 0;
}
.side-head { height: 52px; display: flex; align-items: center; padding: 0 16px; gap: 8px; font-weight: 600; font-size: 13px; flex: none; }
.app-name { display: flex; flex-direction: column; line-height: 1.1; }
.app-name small { font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: .02em; }
.app-icon { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(160deg,#ff5e7e,#ff2d55); display: grid; place-items: center; color: #fff; }
.side-scroll { overflow-y: auto; flex: 1; padding: 0 10px 10px; }
.side-title { font-size: 11px; font-weight: 600; color: var(--text3); padding: 14px 8px 4px; }
.side-row {
  display: flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 8px; border-radius: 6px; cursor: default;
  white-space: nowrap; overflow: hidden;
}
.side-row:hover { background: var(--hover); }
.side-row.sel { background: var(--side-sel); }
.side-row .ic { color: var(--accent); flex: none; width: 16px; display: grid; place-items: center; }
.side-row .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.side-row .cnt { color: var(--text3); font-size: 12px; font-variant-numeric: tabular-nums; }
.side-row .badge { background: var(--orange); color: #fff; font-size: 11px; font-weight: 600; border-radius: 9px; padding: 0 6px; line-height: 17px; }
.side-row.missing .nm { color: var(--text3); text-decoration: line-through; }
.chev { width: 12px; flex: none; color: var(--text3); transition: transform .15s; display: grid; place-items: center; }
.chev.open { transform: rotate(90deg); }
.chev.none { visibility: hidden; }
.side-foot { flex: none; display: flex; gap: 2px; padding: 6px 10px; border-top: 1px solid var(--sep); }
.icon-btn {
  border: 0; background: transparent; border-radius: 6px; height: 26px; min-width: 26px;
  display: inline-grid; place-items: center; color: var(--text2); cursor: default; padding: 0 6px;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn:active { background: var(--side-sel); }
.icon-btn:disabled { opacity: .35; }
.icon-btn.on { color: var(--accent); }

/* ---------- список ---------- */
.list { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--sep); background: var(--window); }
.toolbar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border-bottom: 1px solid var(--sep); background: var(--toolbar);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
}
.back-btn { flex: none; border: 0; background: transparent; color: var(--accent); font: inherit; display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 8px 0 4px; border-radius: 7px; cursor: default; }
.back-btn:hover { background: var(--hover); }
.back-btn[hidden] { display: none; }
.search {
  flex: 1; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px;
  background: var(--hover); border-radius: 7px; color: var(--text3);
}
.search input { border: 0; outline: 0; background: transparent; font: inherit; color: var(--text); flex: 1; min-width: 0; }
.search:focus-within { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
.filters { flex: none; padding: 8px 12px; border-bottom: 1px solid var(--sep); display: flex; }
.seg { display: flex; background: var(--hover); border-radius: 7px; padding: 2px; gap: 1px; width: 100%; }
.seg button {
  flex: 1; border: 0; background: transparent; border-radius: 5px; height: 22px; font-size: 12px;
  color: var(--text2); cursor: default; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap;
}
.seg button.on { background: var(--window); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06); }
@media (prefers-color-scheme: dark) { .seg button.on { background: #5a5a5e; } }
.seg .n { color: var(--text3); font-variant-numeric: tabular-nums; font-size: 11px; }
.rows { overflow-y: auto; flex: 1; padding: 4px 8px 16px; outline: none; }
.group {
  position: sticky; top: -4px; z-index: 1; background: var(--window);
  font-size: 11px; font-weight: 600; color: var(--text2); padding: 10px 8px 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row {
  display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center;
  padding: 7px 8px; border-radius: 7px; cursor: default; margin: 1px 0;
}
.row + .row { box-shadow: 0 -1px 0 -0px var(--sep) inset; }
.row:hover { background: var(--hover); }
.row .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { grid-column: 2 / 4; color: var(--text2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tags { display: flex; gap: 3px; }
.row .tag { font-size: 10px; font-weight: 600; color: var(--text3); }
.row.sel { background: var(--accent); color: #fff; }
.row.sel .s, .row.sel .tag { color: rgba(255,255,255,.78); }
.row.sel .st { color: #fff !important; }
.row.sel .dot { background: #fff; }
.st { width: 14px; height: 14px; display: grid; place-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.dot.red { background: var(--red); }
.row.sel .dot.red { background: #fff; box-shadow: 0 0 0 2px var(--red); }
.updated { display: flex; align-items: center; gap: 8px; background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 8px 12px; margin: -4px 0 16px; font-weight: 500; }
.empty { color: var(--text3); text-align: center; padding: 40px 20px; }
.fcard { margin: 8px 4px 6px; padding: 10px 12px; border-radius: 9px; background: var(--card); font-size: 12px; color: var(--text2); display: flex; flex-direction: column; gap: 6px; }
.fcard .fh { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; font-size: 13px; }
.fcard .prog { height: 4px; border-radius: 2px; background: var(--hover); overflow: hidden; }
.fcard .prog i { display: block; height: 100%; background: var(--green); border-radius: 2px; }
.fcard.ready { background: var(--orange-soft); }
.fcard.embedded { background: var(--green-soft); }
.fcard .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fcard .row2 .btn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.fcard .why { color: var(--text3); }
.side-row .fst { flex: none; display: grid; place-items: center; }
.note {
  margin: 8px 4px 4px; padding: 10px 12px; background: var(--card); border-radius: 8px; font-size: 12px; color: var(--text2);
  white-space: pre-wrap; user-select: text; -webkit-user-select: text; max-height: 76px; overflow: hidden; position: relative; cursor: default;
}
.note.open { max-height: none; }
.note:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: linear-gradient(transparent, var(--card)); }

/* ---------- деталі ---------- */
.detail { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.detail .toolbar { justify-content: space-between; }
.save-state { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.save-state.err { color: var(--orange); }
.toolbar .grow { flex: 1; }
.pane { overflow-y: auto; flex: 1; padding: 22px 28px 40px; }
.crumbs { color: var(--text2); font-size: 12px; margin-bottom: 2px; user-select: text; -webkit-user-select: text; }
.title { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 16px; word-break: break-word; user-select: text; -webkit-user-select: text; }
.status-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.sbtn {
  border: 1px solid var(--field-border); background: var(--field); border-radius: 7px; height: 30px; padding: 0 12px;
  display: inline-flex; align-items: center; gap: 6px; cursor: default; font-weight: 500;
}
.sbtn:hover { background: var(--hover); }
.sbtn kbd { font: 11px -apple-system, sans-serif; color: var(--text3); margin-left: 2px; }
.sbtn.ok.on { background: var(--green-soft); border-color: transparent; color: var(--green); }
.sbtn.fix.on { background: var(--orange-soft); border-color: transparent; color: var(--orange); }
.sbtn.regen.on { background: var(--purple-soft); border-color: transparent; color: var(--purple); }
.sbtn.on kbd { color: inherit; opacity: .7; }
.sbtn:disabled { opacity: .4; cursor: not-allowed; }
.sbtn:disabled:hover { background: var(--field); }
.status-bar.under { margin: -8px 0 18px; align-items: center; }
.chip { font-size: 12px; color: var(--text2); display: inline-flex; align-items: center; gap: 6px; }
.chip.run { color: var(--accent); }
.chip.err { color: var(--red); }
.spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.vol-row { display: flex; align-items: center; gap: 8px; margin: -6px 0 18px; color: var(--text2); font-size: 12px; flex-wrap: wrap; }
.vol-row input { width: 64px; font: inherit; font-size: 13px; color: var(--text); background: var(--field); border: 1px solid var(--field-border); border-radius: 6px; height: 26px; padding: 0 6px; outline: none; text-align: right; user-select: text; -webkit-user-select: text; }
.vol-row input:focus { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.vol-row .vt { font-weight: 600; color: var(--text); }
.agent-card { background: var(--card); border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; font-size: 13px; user-select: text; -webkit-user-select: text; white-space: pre-wrap; }
.agent-card .h { font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.log { background: var(--card); border-radius: 10px; padding: 10px 12px; font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow-y: auto; user-select: text; -webkit-user-select: text; color: var(--text2); }
.jobmeta { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 12px; margin-bottom: 18px; user-select: text; -webkit-user-select: text; }
.jobmeta dt { color: var(--text3); } .jobmeta dd { margin: 0; }
.qbtns { display: flex; gap: 8px; margin-bottom: 18px; }

.players { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.player {
  display: grid; grid-template-columns: 34px 26px 38px 1fr 76px; align-items: center; gap: 10px;
  background: var(--card); border-radius: 10px; padding: 8px 12px 8px 8px;
}
.player.active { box-shadow: 0 0 0 1.5px var(--accent) inset; }
.play {
  width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
  display: grid; place-items: center; cursor: default;
}
.play:active { filter: brightness(.9); }
.replay { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--hover); color: var(--text2); display: grid; place-items: center; cursor: default; }
.replay:hover { color: var(--accent); background: var(--accent-soft); }
.player.editable .wave-wrap { cursor: text; }
.sel-info { color: var(--accent); font-weight: 500; }
.selbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0 0 70px; font-size: 12px; color: var(--text2); }
.selbar[hidden] { display: none; }
.selbar .rng { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 4px; }
.selbar button { font: inherit; font-size: 12px; height: 24px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--field-border); background: var(--field); color: var(--text); cursor: default; }
.selbar button.pri { background: var(--accent); border-color: transparent; color: #fff; }
.selbar button:disabled { opacity: .45; }
.selbar button.x { border: 0; background: transparent; color: var(--text3); padding: 0 6px; }
.ptag { font-weight: 700; font-size: 12px; color: var(--text2); text-align: center; }
.wave-wrap { position: relative; height: 40px; cursor: pointer; }
.wave-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pname { position: absolute; left: 0; bottom: -2px; font-size: 10px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; pointer-events: none; display: none; }
.ptime { font-size: 12px; color: var(--text2); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ptime b { color: var(--text); font-weight: 500; }

.section-label { font-size: 11px; font-weight: 600; color: var(--text3); margin: 0 0 6px; }
.grp-label { font-size: 11px; font-weight: 600; color: var(--text3); margin: 0 0 6px 2px; letter-spacing: .02em; }
.grp-label.tr { margin-top: 4px; color: var(--accent); }
.players.src { margin-bottom: 8px; }
.refrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin: 0 0 16px 2px; }
.refrow .rb { font: inherit; font-size: 11px; font-weight: 700; height: 22px; min-width: 38px; padding: 0 9px; border-radius: 11px; border: 1px solid var(--field-border); background: var(--field); color: var(--text2); cursor: default; }
.refrow .rb.on { background: var(--accent); border-color: transparent; color: #fff; }
.refrow .hint { color: var(--text3); }
textarea.comment {
  width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--text); background: var(--field);
  border: 1px solid var(--field-border); border-radius: 8px; padding: 8px 10px; outline: none; margin-bottom: 18px;
}
textarea.comment:focus { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.text {
  white-space: pre-wrap; background: var(--card); border-radius: 10px; padding: 12px 14px; font-size: 13px;
  user-select: text; -webkit-user-select: text; word-break: break-word;
}
.files-line { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; }
.link-btn:hover { text-decoration: underline; }
.placeholder { flex: 1; display: grid; place-items: center; color: var(--text3); text-align: center; padding: 40px; }
.placeholder h2 { font-size: 15px; color: var(--text2); font-weight: 600; margin: 0 0 6px; }
.keys { font-size: 11px; color: var(--text3); margin-top: 24px; line-height: 1.9; }
.keys kbd, .placeholder kbd {
  font: 11px -apple-system, sans-serif; background: var(--card); border: 1px solid var(--sep); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 5px; color: var(--text2); margin: 0 2px;
}

/* ---------- лист «Додати проєкт» ---------- */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.18); display: none; justify-content: center; align-items: flex-start; z-index: 10; }
.sheet-back.show { display: flex; }
.sheet {
  margin-top: 60px; width: 440px; background: var(--window); border-radius: 12px; box-shadow: var(--shadow); padding: 20px;
  animation: drop .18s ease-out;
}
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } }
.sheet h3 { margin: 0 0 4px; font-size: 14px; }
.sheet p { margin: 0 0 14px; color: var(--text2); font-size: 12px; }
.field { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; margin-bottom: 10px; }
.field label { text-align: right; color: var(--text2); }
.field input {
  font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--field-border); border-radius: 6px;
  height: 26px; padding: 0 8px; outline: none; min-width: 0; user-select: text; -webkit-user-select: text;
}
.field input:focus { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.path-row { display: flex; gap: 6px; }
.path-row input { flex: 1; }
.btn {
  font: inherit; height: 26px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--field-border);
  background: var(--field); color: var(--text); cursor: default; white-space: nowrap;
}
.btn:active { filter: brightness(.95); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.sheet .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.sheet .err { color: #ff3b30; font-size: 12px; min-height: 16px; margin-left: 78px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(40,40,42,.92); color: #fff;
  padding: 8px 14px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
}

const STATUS = {
  ok:    { name: "Готово",         key: "1", color: "var(--green)" },
  fix:   { name: "Виправити",      key: "2", color: "var(--orange)" },
};
const FILTERS = [
  ["all", "Усі"], ["new", "Нові"], ["ok", "Готово"], ["fix", "Виправити"], ["upd", "Оновлені"],
];
const SOURCE = ["en","eng","orig","original","src","ref","ja","jp","jpn","old"];
const TARGET = ["ua","uk","ukr","new"];
const LANG_ALIAS = { eng: "en", jp: "ja", jpn: "ja", uk: "ua", ukr: "ua" };
const LANG_NAME = { en: "англійська", ja: "японська", ua: "українська" };
function canon(tag) { const t = (tag || "").toLowerCase(); return LANG_ALIAS[t] || t; }
/* оригінали фрази (усе, крім доріжки перекладу) */
function originals(it) { const vt = volTarget(it); return it.files.filter((f) => f !== vt && SOURCE.includes((f.tag || "").toLowerCase())); }
/* еталон для агента й нормалізації: вибір фрази → мова проєкту за замовчуванням → перший оригінал; "none" — без еталона */
function effRef(it) {
  const langs = originals(it).map((f) => canon(f.tag)); if (!langs.length) return null;
  const want = (S.fb[it.id] || {}).ref;
  if (want === "none") return null;
  if (want && langs.includes(want)) return want;
  const pr = S.projects.find((x) => x.id === S.pid) || {};
  if (pr.default_ref && langs.includes(pr.default_ref)) return pr.default_ref;
  return langs[0];
}
function refFile(it) { const r = effRef(it); return r ? originals(it).find((f) => canon(f.tag) === r) : null; }
function renderRefRow(it) {
  const row = $("refRow"); if (!row) return;

    <span class="hint">${r ? `«правильно» = як ${esc(LANG_NAME[r] ? "в " + LANG_NAME[r].replace(/а$/, "ій") : r.toUpperCase())}` : "не вибрано — лише за коментарем"}</span>`;

}

const $ = (id) => document.getElementById(id);

  del(k) { try { localStorage.removeItem("sluhach." + k); } catch {} },

async function api(path, body) {
  const r = await fetch(path, body === undefined ? { cache: "no-store" }
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("Помилка " + r.status));
  return data;
}
function toast(msg, actionLabel, action) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("act", !!action);
  if (action) { const b = document.createElement("button"); b.textContent = actionLabel; b.onclick = () => { t.classList.remove("show"); action(); }; t.appendChild(b); }
  t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), action ? 5000 : 2200);
}
function fileUrl(file) { return "/file?p=" + encodeURIComponent(S.pid) + "&f=" + encodeURIComponent(file.path) + "&v=" + (file.mtime || 0); }
const nowSec = () => Date.now() / 1000;
function firstLine(t) { return (String(t || "").split("\n").find((l) => l.trim()) || "").trim(); }
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); }

/* ---------- проєкти ---------- */
async function loadProjects() {
  S.projects = await api("/api/projects");

  if (S.view === "home") renderHome();
}
function renderProjects() {
  const el = $("projects");
  if (!S.projects.length) { el.innerHTML = '<div class="side-row" style="color:var(--text3)">Немає проєктів</div>'; return; }

    </div>`).join("");

}
$("projects").addEventListener("click", (e) => {

function projectSig(items) { let m = 0; for (const it of items) m += it.mtime; return items.length + ":" + m.toFixed(2); }

    const sameIds = data.items.length === S.items.length && data.items.every((it, i) => it.id === S.items[i].id);
    const playing = players.some((p) => !p.audio.paused);

/* ---------- клавіатура (працює і на українській розкладці) ---------- */
document.addEventListener("keydown", (e) => {
  if ($("sheetBack").classList.contains("show")) { if (e.key === "Escape") closeSheet(); if (e.key === "Enter") addProject(); return; }
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input") { if (e.key === "Escape") { e.target.blur(); $("rows").focus(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) {
    if ((e.metaKey || e.ctrlKey) && e.code === "KeyF") { e.preventDefault(); $("q").focus(); $("q").select(); }
    if ((e.metaKey || e.ctrlKey) && e.code === "KeyZ" && S.view !== "queue" && S.sel) { e.preventDefault(); undoAudio(e.shiftKey); }
    return;
  }
  const c = e.code;
  if (S.view === "home") return;
  if (S.view === "queue") {
    if (e.key === "Escape") { e.preventDefault(); goBack(); return; }
    if (c === "ArrowDown" || c === "ArrowUp") { e.preventDefault(); moveJob(c === "ArrowDown" ? 1 : -1); }
    return;
  }
  if (c === "ArrowDown") { e.preventDefault(); move(1); }
  else if (c === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (c === "Space") { e.preventDefault(); const p = players[activeIdx]; if (p) p.toggle(); }
  else if (c === "KeyE") playTag(SOURCE, 0);
  else if (c === "KeyU") playTag(TARGET, 1);
  else if (c === "KeyJ") playTag(["ja", "jp", "jpn"], -1);
  else if (c === "KeyA") playAll();
  else if (c === "KeyR") { const p = players[activeIdx]; if (p) { chain = null; p.play(true); } }
  else if (e.key === "Escape") { const p = editPlayer(); if (p && p.sel) p.setSel(null); }
  else if (c === "Digit1") setStatus("ok");
  else if (c === "Digit2") setStatus("fix");
  else if (c === "Digit0" || c === "Backspace") { if (S.sel && (S.fb[S.sel] || {}).status) { setFb(S.sel, { status: null }); afterFbChange(); } }
  else if (c === "KeyC") { const ta = $("comment"); if (ta) { e.preventDefault(); ta.focus(); } }
  else if (c === "ArrowRight" || c === "ArrowLeft") { const p = players[activeIdx]; if (p && isFinite(p.duration)) { e.preventDefault(); p.audio.currentTime = Math.max(0, Math.min(p.duration, p.audio.currentTime + (c === "ArrowRight" ? 1 : -1))); p.draw(); } }
  else if (c === "Tab" && players.length > 1) { e.preventDefault(); activate((activeIdx + (e.shiftKey ? players.length - 1 : 1)) % players.length); }
});

    if (ref) body.ref = ref.path;
    const r = await api("/api/audio-edit?p=" + encodeURIComponent(S.pid), body);
    f.mtime = r.mtime; it.mtime = Math.max(...it.files.map((x) => x.mtime || 0)); S.sig = projectSig(S.items);
    const i = r.info || {}; const where = sel ? `шматок ${sel[0].toFixed(1)}–${sel[1].toFixed(1)} с` : f.name;
    toast(op === "normalize"
      ? `${where}: ${i.before} → ${i.after} ${i.unit} (${ref ? canon(ref.tag).toUpperCase() : "решта файлу"} ${i.en}), ${i.db > 0 ? "+" : ""}${i.db} дБ`
      : `${where}: ${i.db > 0 ? "+" : ""}${i.db} дБ`, "Скасувати ⌘Z", () => undoAudio(false));
    renderDetail(); updateRow(it.id); renderFilters();
    if (sel) { const np = editPlayer(); if (np) setTimeout(() => np.setSel(sel[0], sel[1]), 50); }
  } catch (err) { toast(err.message); busy(false); }
}
async function undoAudio(redo) {
  const it = S.byId.get(S.sel); const p = editPlayer(); if (!it || !p) return;
  const f = p.file; const sel = p.sel;
  try {
    const r = await api("/api/audio-undo?p=" + encodeURIComponent(S.pid), { f: f.path, redo });
    f.mtime = r.mtime; it.mtime = Math.max(...it.files.map((x) => x.mtime || 0)); S.sig = projectSig(S.items);
    renderDetail(); updateRow(it.id); renderFilters();
    if (sel) { const np = editPlayer(); if (np) setTimeout(() => np.setSel(sel[0], sel[1]), 50); }
    const h = r.history;
    toast(`${redo ? "Повторено" : "Скасовано"} · ще можна скасувати ${h.undo}, повторити ${h.redo}`,
      redo ? "Скасувати ⌘Z" : "Повторити ⇧⌘Z", () => undoAudio(!redo));
  } catch (err) { toast(err.message); }
}
function jobLine(j) {
  const [n, c] = JOB_ST[j.status] || [j.status, "var(--text3)"];
  const icon = j.status === "running" ? '<span class="spin"></span>' : j.status === "queued" ? I.clock : "";
  return `<span class="chip ${j.status === "running" ? "run" : j.status === "error" ? "err" : ""}" style="color:${c}">${icon}${n}</span>`;
}
function renderJobInfo() {
  const chip = $("jobChip"), card = $("agentCard"); if (!chip || !card || !S.sel) return;
  const a = activeJob(S.sel), l = lastJob(S.sel);
  if (a) {
    const pos = S.jobs.filter((j) => j.status === "queued").findIndex((j) => j.id === a.id) + 1;
    chip.innerHTML = jobLine(a) + (a.status === "queued" && pos ? `<span class="chip">· ${pos}-а в черзі</span>` : "")
      + ` <button class="link-btn" data-jobopen="${a.id}">деталі</button>`;
  } else chip.innerHTML = l ? ` <button class="link-btn" data-jobopen="${l.id}">остання правка агента</button>` : "";
  const show = l && (l.status === "done" || l.status === "error") && l.result;
  card.innerHTML = show ? `<div class="agent-card"><div class="h">${l.status === "error" ? "АГЕНТ: ПОМИЛКА" : "ВІДПОВІДЬ АГЕНТА"} · ${esc((l.finished || "").replace("T", " ").slice(5, 16))}</div>${esc(l.result)}</div>` : "";
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-jobopen]"); if (!b) return;
  S.jobSel = b.dataset.jobopen; setView("queue");
});

async function refreshQueue(force) {
  let st; try { st = await api("/api/queue"); } catch { return; }
  const prev = new Map(S.jobs.map((j) => [j.id, j.status]));
  S.jobs = st.jobs; S.qsettings = st.settings; renderRail(st.agent);
  const sig = S.jobs.map((j) => j.id + j.status).join(",");
  const changed = sig !== S.jobsSig; S.jobsSig = sig;
  const active = S.jobs.filter((j) => j.status === "queued" || j.status === "running").length;
  $("queueBadge").innerHTML = active ? `<span class="badge" style="background:var(--accent)">${active}</span>` : "";
  if (S.needReload) refreshIfChanged();
  if (S.detailStale && S.view !== "queue") {
    const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
    if (!players.some((p) => !p.audio.paused) && tag !== "textarea" && tag !== "input") { S.detailStale = false; renderDetail(); }
  }
  if (!changed && !force) { if (S.view === "queue") refreshLog(); return; }
  const finishedHere = S.jobs.some((j) => j.pid === S.pid && (j.status === "done" || j.status === "error") && prev.get(j.id) !== j.status);
  if (finishedHere) { S.needReload = true; refreshIfChanged(); }
  if (S.view === "queue") { renderQueueList(); renderJobDetail(); return; }
  for (const j of S.jobs) if (j.pid === S.pid && (prev.get(j.id) !== j.status)) updateRow(j.item);
  renderJobInfo();
}
setInterval(refreshQueue, 3000);

/* ---------- головна сторінка ---------- */
const DOCS_URL = "";   // посилання на документацію — поки порожнє
function renderHome() {
  const last = ls.get("lastProject");
  const cards = S.projects.map((p) => `
    <div class="pcard ${p.exists ? "" : "missing"}" data-open="${p.id}" title="${esc(p.path)}">
      <div class="pt"><span class="gi">${I.game}</span>${esc(p.name)}${p.id === last ? '<span class="last">ОСТАННІЙ</span>' : ""}</div>
      <div class="pp">${esc(p.path)}${p.exists ? "" : " — теки немає"}</div>
      <div class="ps">
        <span title="Прослухано">${I.headphones} <b>${p.heard || 0}</b></span>
        <span title="Готово" style="color:var(--green)">✓ <b>${p.ok || 0}</b></span>
        <span title="Виправити" style="color:var(--orange)">✎ <b>${p.fix || 0}</b></span>
        ${p.ready_folders ? `<span title="Теки, готові до вбудовування" style="color:var(--orange)">${I.box} <b>${p.ready_folders}</b></span>` : ""}
        ${p.embedded_folders ? `<span title="Вбудовані теки" style="color:var(--green)">${I.embtri} <b>${p.embedded_folders}</b></span>` : ""}
      </div>
      ${p.last_change ? `<div class="pp">Остання позначка: ${esc(fdate(p.last_change))}</div>` : ""}
    </div>`).join("");
  $("home").innerHTML = `<div class="home-in">
    <div class="home-top"><div class="big-icon">${I.headphones.replace('width="13" height="13"', 'width="30" height="30"')}</div>
      <div><h1>наСлух</h1><p>ByEar — прослуховування й правка озвучки ігор</p></div><span class="grow"></span>
      <a class="doc-link ${DOCS_URL ? "on" : ""}" ${DOCS_URL ? `href="${DOCS_URL}" target="_blank" rel="noopener"` : 'title="Документація ще не готова"'}>${I.book} Документація</a></div>
    <div class="home-h">Проєкти</div>
    <div class="pgrid">${cards}<div class="pcard add" id="homeAdd">${I.plus}&nbsp; Новий проєкт</div></div>
  </div>`;
}
$("home").addEventListener("click", async (e) => {
  if (e.target.closest("#homeAdd")) { openSheet(); return; }
  const c = e.target.closest("[data-open]"); if (!c) return;
  const id = c.dataset.open;
  if (id === S.pid && S.project) setView("phrases", { restore: false }); else await openProject(id);
});
const AG_ST = { stopped: "зупинено", starting: "запуск…", idle: "вільний", working: "працює", compacting: "стискає…", error: "помилка" };
function kfmt(n) { return n == null ? "—" : n >= 1000 ? Math.round(n / 1000) + "к" : String(n); }
function renderRail(a) {
  if (!a) return; S.agent = a;
  const max = a.auto_compact_at || 200000, frac = a.ctx ? Math.min(1, a.ctx / max) : 0;
  $("railNum").textContent = kfmt(a.ctx);
  $("railMax").textContent = a.auto_compact_at ? "з " + kfmt(a.auto_compact_at) : "";
  const f = $("railFill"); f.style.height = (frac * 100).toFixed(1) + "%";
  f.style.background = frac < .6 ? "var(--green)" : frac < .9 ? "var(--orange)" : "var(--red)";
  $("railDot").className = "sd " + a.state;
  let st = AG_ST[a.state] || a.state;
  if (a.compact_requested && a.state === "working") st = "стисну після правки";
  $("railState").textContent = st;
  const lc = a.last_compact ? `\nОстаннє стиснення: ${a.last_compact.time.slice(11, 16)}, було ${kfmt(a.last_compact.before)}` : "";
  $("rail").title = `Модель: ${a.model}\nКонтекст: ${a.ctx == null ? "ще невідомо" : a.ctx.toLocaleString("uk-UA") + " токенів"}`
    + (a.auto_compact_at ? `\nАвтостиснення на ${a.auto_compact_at.toLocaleString("uk-UA")}` : "")
    + `\nПравок за цей запуск: ${a.jobs}\nВартість за цінами API: ≈$${(a.cost || 0).toFixed(2)}${lc}` + (a.error ? "\nПомилка: " + a.error : "");
  $("compactBtn").disabled = a.ctx == null || a.state === "compacting" || a.compact_requested || !a.claude;
  $("restartBtn").disabled = a.state === "working" || a.state === "compacting" || !a.claude;
}
$("compactBtn").onclick = async () => {
  try { await api("/api/agent/compact", {}); toast(S.agent && S.agent.state === "working" ? "Стисну, щойно агент закінчить правку" : "Стискаю контекст агента…"); refreshQueue(true); }
  catch (err) { toast(err.message); }
};
$("restartBtn").onclick = async () => {
  if (!confirm("Почати з новим агентом?\n\nПоточний агент забуде все, що робив за цей запуск. Черга й файли не зміняться.")) return;
  try { await api("/api/agent/restart", {}); toast("Запущено нового агента"); refreshQueue(true); } catch (err) { toast(err.message); }
};
function setView(v, opts = {}) {
  if (v === S.view && v !== "queue") return;
  if (v === "queue" && S.view !== "queue") {
    S.back = { view: S.view, label: S.label, filter: S.filter, sel: S.sel, q: $("q").value, scroll: $("rows").scrollTop };
  }
  S.view = v;
  $("backBtn").hidden = v !== "queue";
  document.querySelector(".app").classList.toggle("home", v === "home");
  $("homeRow").classList.toggle("sel", v === "home");
  if (v === "home") {
    stopAll(); $("queueRow").classList.remove("sel");
    $("projects").querySelectorAll(".sel").forEach((x) => x.classList.remove("sel"));
    $("folders").querySelectorAll(".sel").forEach((x) => x.classList.remove("sel"));
    renderHome(); return;
  }
  $("queueRow").classList.toggle("sel", v === "queue");
  document.querySelector(".filters").style.display = v === "queue" ? "none" : "";
  $("q").placeholder = v === "queue" ? "Пошук у черзі" : "Пошук у назвах і тексті";
  const back = v !== "queue" && opts.restore !== false ? S.back : null;
  $("q").value = back ? back.q : ""; S.q = $("q").value.trim().toLowerCase();
  if (back) { S.label = back.label; S.filter = back.filter; if (back.sel && S.byId.has(back.sel)) S.sel = back.sel; }
  if (v === "queue") { stopAll(); $("projects").querySelectorAll(".sel").forEach((x) => x.classList.remove("sel")); $("folders").querySelectorAll(".sel").forEach((x) => x.classList.remove("sel")); renderQueueList(); renderJobDetail(); }
  else {
    renderProjects(); renderFolders(); renderFilters(); renderList(); renderDetail();
    if (back && back.scroll != null) $("rows").scrollTop = back.scroll; else scrollToSel("center");
  }
}
function goBack() { if (S.view === "queue") setView(S.back && S.back.view === "home" ? "home" : "phrases"); }
$("backBtn").onclick = goBack;
$("queueRow").onclick = () => (S.view === "queue" ? goBack() : setView("queue"));
$("homeRow").onclick = () => setView("home");
$("sideHead").onclick = () => setView("home");

function visibleJobs() {
  const q = S.q; const order = { running: 0, queued: 1, error: 2, done: 3, cancelled: 4 };
  return S.jobs.filter((j) => !q || (j.name + j.comment + j.project + (j.result || "")).toLowerCase().includes(q))
    .slice().sort((a, b) => (order[a.status] - order[b.status]) || (a.status === "queued" ? (a.created < b.created ? -1 : 1) : (b.created < a.created ? -1 : 1)));
}
function renderQueueList() {
  const list = visibleJobs(); const rows = $("rows"); const st = rows.scrollTop;
  let html = "", last = null;
  for (const j of list) {
    const g = j.status === "running" || j.status === "queued" ? "Зараз" : "Завершені";
    if (g !== last) { last = g; html += `<div class="group">${g}</div>`; }
    const [n, c] = JOB_ST[j.status];
    const icon = j.status === "running" ? '<span class="spin"></span>' : j.status === "queued" ? I.clock
      : j.status === "done" ? I.ok : j.status === "error" ? I.warn : I.minus;
    html += `<div class="row ${j.id === S.jobSel ? "sel" : ""}" data-job="${j.id}">
      <span class="st" style="color:${c}" title="${n}">${icon}</span><span class="t">${esc(j.name)}</span>
      <span class="tags"><span class="tag">${esc(j.project)}</span></span>
      <span class="s">💬 ${esc(j.comment)}</span></div>`;
  }
  if (!list.length) html = `<div class="empty">Черга порожня.<br><br>Напиши коментар до фрази й натисни «Виправити» — агент візьме її в роботу.</div>`;
  rows.innerHTML = html; rows.scrollTop = st;
}
$("rows").addEventListener("click", (e) => {
  const r = e.target.closest("[data-job]"); if (!r) return;
  S.jobSel = r.dataset.job; renderQueueList(); renderJobDetail();
});
function moveJob(d) {
  const list = visibleJobs(); if (!list.length) return;
  let i = list.findIndex((j) => j.id === S.jobSel); i = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + d));
  S.jobSel = list[i].id; renderQueueList(); renderJobDetail();
  const r = $("rows").querySelector(".row.sel"); if (r) r.scrollIntoView({ block: "nearest" });
}
function renderJobDetail() {
  const pane = $("pane"); const j = S.jobs.find((x) => x.id === S.jobSel);
  $("revealBtn").disabled = true;
  if (!j) {
    const s = S.qsettings || {};
    const act = S.jobs.filter((x) => x.status === "running").length, wait = S.jobs.filter((x) => x.status === "queued").length;
    pane.style.display = "flex";
    pane.innerHTML = `<div class="placeholder"><div><h2>Черга правок</h2>Агент ${act ? "працює" : "вільний"}, у черзі ${wait}.<br>Один агент на запуск наСлуху, модель ${esc(s.model || "")}.<br>Розмір його контексту — на смужці зліва; автостиснення на ${kfmt(s.auto_compact_at)}.<br><br>${S.jobs.some((x) => x.status === "done" || x.status === "cancelled") ? '<button class="btn" id="clearDone">Прибрати завершені</button>' : ""}</div></div>`;
    const cd = $("clearDone"); if (cd) cd.onclick = async () => { await api("/api/queue/clear", {}); S.jobSel = null; refreshQueue(true); };
    return;
  }
  pane.style.display = "";
  const tok = j.tokens ? `${Math.round(j.tokens / 1000)} тис.` : "—";
  pane.innerHTML = `
    <div class="crumbs">${esc(j.project)}${j.label ? " › " + esc(j.label.split("/").join(" › ")) : ""}</div>
    <h1 class="title">${esc(j.name)}</h1>
    <div class="status-bar">${jobLine(j)}</div>
    <div class="qbtns">
      <button class="btn" id="jOpen">Відкрити фразу</button>
      ${j.status === "queued" || j.status === "running" ? '<button class="btn" id="jCancel">Скасувати</button>' : '<button class="btn" id="jRetry">Ще раз</button>'}
    </div>
    <dl class="jobmeta">
      <dt>Коментар</dt><dd>${esc(j.comment)}</dd>
      ${"ref" in j ? `<dt>Еталон</dt><dd>${j.ref ? esc(String(j.ref).toUpperCase()) : "немає — лише за коментарем"}</dd>` : ""}
      <dt>Додано</dt><dd>${esc((j.created || "").replace("T", " "))}</dd>
      ${j.started ? `<dt>Почато</dt><dd>${esc(j.started.replace("T", " "))}</dd>` : ""}
      ${j.finished ? `<dt>Завершено</dt><dd>${esc(j.finished.replace("T", " "))}</dd>` : ""}
      ${j.tokens ? `<dt>Токени</dt><dd>${tok}${j.cost != null ? ` · ≈$${Number(j.cost).toFixed(2)} за цінами API` : ""}${j.ctx_after ? ` · контекст після: ${kfmt(j.ctx_after)}` : ""}</dd>` : ""}
      ${j.note ? `<dt>Примітка</dt><dd>${esc(j.note)}</dd>` : ""}
    </dl>
    ${j.result ? `<div class="agent-card"><div class="h">${j.status === "error" ? "ПОМИЛКА" : "ВІДПОВІДЬ АГЕНТА"}</div>${esc(j.result)}</div>` : ""}
    <div class="section-label">Що робить агент</div>
    <div class="log" id="jobLog">…</div>`;
  $("jOpen").onclick = async () => {
    setView("phrases", { restore: false });
    if (j.pid !== S.pid) await openProject(j.pid, j.item);
    else { S.label = ""; S.filter = "all"; renderFolders(); renderFilters(); renderList(); select(j.item, { force: true }); scrollToSel("center"); }
  };
  const c = $("jCancel"); if (c) c.onclick = async () => { await api("/api/queue/cancel", { id: j.id }); refreshQueue(true); };
  const r = $("jRetry"); if (r) r.onclick = async () => { const x = await api("/api/queue/retry", { id: j.id }); S.jobSel = x.job && x.job.id; refreshQueue(true); };
  refreshLog(true);
}
async function refreshLog(force) {
  const el = $("jobLog"); const j = S.jobs.find((x) => x.id === S.jobSel);
  if (!el || !j || (!force && j.status !== "running")) return;
  try {
    const r = await api("/api/queue/log?id=" + encodeURIComponent(j.id));
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
    el.textContent = r.log || (j.status === "queued" ? "Чекає вільного агента…" : "Журналу немає");
    if (atBottom || force) el.scrollTop = el.scrollHeight;
  } catch {}
}

/* ---------- кнопки панелей ---------- */
$("appIcon").innerHTML = I.headphones; $("queueIcon").innerHTML = I.queue;
$("backIcon").innerHTML = I.back; $("homeIcon").innerHTML = I.house;
$("railAgIcon").innerHTML = I.spark; $("compactIcon").innerHTML = I.compress; $("restartIcon").innerHTML = I.restart;
$("searchIcon").innerHTML = I.search;
$("addBtn").innerHTML = I.plus; $("removeBtn").innerHTML = I.minus; $("rescanBtn").innerHTML = I.refresh;
$("revealBtn").innerHTML = I.finder; $("autoBtn").innerHTML = I.auto;
S.auto = ls.get("auto", false); $("autoBtn").classList.toggle("on", S.auto);
$("autoBtn").onclick = () => { S.auto = !S.auto; ls.set("auto", S.auto); $("autoBtn").classList.toggle("on", S.auto); toast(S.auto ? "Автовідтворення увімкнено" : "Автовідтворення вимкнено"); };
$("revealBtn").onclick = () => { const it = S.byId.get(S.sel); if (it && it.files[0]) api("/api/reveal?p=" + encodeURIComponent(S.pid), { f: it.files[0].path }).catch((e) => toast(e.message)); };
$("rescanBtn").onclick = async () => { if (S.pid) { await openProject(S.pid, S.sel); toast("Папку перечитано"); } };
$("removeBtn").onclick = async () => {
  const p = S.projects.find((x) => x.id === S.pid); if (!p) return;
  if (!confirm(`Прибрати «${p.name}» зі списку?\n\nФайли й «summary.json» у папці залишаться — проєкт можна додати знову.`)) return;
  await api("/api/projects/remove", { id: p.id }); S.pid = null; ls.del("lastProject");
  await loadProjects(); if (S.projects[0]) openProject(S.projects[0].id); else { S.items = []; S.project = null; $("rows").innerHTML = ""; $("foldersBlock").hidden = true; renderDetail(); renderSaveState(); }
};
function openSheet() { $("pName").value = ""; $("pPath").value = ""; $("pErr").textContent = ""; $("sheetBack").classList.add("show"); setTimeout(() => $("pName").focus(), 30); }
function closeSheet() { $("sheetBack").classList.remove("show"); }
async function addProject() {
  $("pErr").textContent = "";
  try {
    const r = await api("/api/projects/add", { name: $("pName").value, path: $("pPath").value });
    closeSheet(); await loadProjects(); openProject(r.id);
  } catch (err) { $("pErr").textContent = err.message; }
}
$("addBtn").onclick = openSheet;
$("cancelBtn").onclick = closeSheet;
$("okBtn").onclick = addProject;
$("sheetBack").addEventListener("mousedown", (e) => { if (e.target === $("sheetBack")) closeSheet(); });
$("pickBtn").onclick = async () => {
  try {
    const r = await api("/api/pick-folder", {});
    if (r.path) { $("pPath").value = r.path; if (!$("pName").value) $("pName").value = r.path.split("/").pop(); }
  } catch (err) { $("pErr").textContent = err.message; }
};

/* ---------- старт ---------- */
(async () => {
  try { await loadProjects(); }
  catch { $("rows").innerHTML = '<div class="empty">Сервер не відповідає. Запустіть «ByEar.command».</div>'; return; }
  let last = null;
  try { last = (await api("/api/state")).last_project || null; } catch {}
  last = last || ls.get("lastProject");
  const p = S.projects.find((x) => x.id === last && x.exists);
  if (p) await openProject(p.id); else setView("home");
  refreshQueue(true);
  $("rows").focus();
})();
</script>
