<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>наСлух</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff2d55'/%3E%3Cpath d='M20 38v-6a12 12 0 0 1 24 0v6' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Crect x='15' y='36' width='9' height='14' rx='4' fill='white'/%3E%3Crect x='40' y='36' width='9' height='14' rx='4' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="ag" id="railAg"><span id="railAgIcon"></span><span class="sd" id="railDot"></span></div>
    <div class="lbl">Агент</div>
    <div class="num" id="railNum">—</div>
    <div class="lbl" id="railMax"></div>
    <div class="bar" id="railBar"><i id="railFill" style="height:0"></i></div>
    <div class="rst" id="railState">—</div>
    <button id="compactBtn" title="Стиснути контекст агента (/compact)"><span id="compactIcon"></span>Стиснути</button>
    <div class="usage" id="railUsage" hidden><div class="lbl" id="railUsageLbl"></div><div class="unum" id="railUsageNum"></div><div class="lbl">лишилось</div></div>
    <span class="grow"></span>
    <button id="restartBtn" title="Почати з новим агентом (контекст обнулиться)"><span id="restartIcon"></span>Новий</button>
  </nav>
  <aside class="sidebar">
    <div class="side-head" id="sideHead" title="Головна" style="cursor:default"><span class="app-icon" id="appIcon"></span><span class="app-name">наСлух<small>ByEar</small></span></div>
    <div class="side-scroll">
      <div class="side-title">Робота</div>
      <div class="side-row" id="homeRow"><span class="chev none"></span><span class="ic" id="homeIcon"></span><span class="nm">Головна</span></div>
      <div class="side-row" id="queueRow"><span class="chev none"></span><span class="ic" id="queueIcon"></span><span class="nm">Черга</span><span id="queueBadge"></span></div>
      <div class="side-title">Проєкти</div>
      <div id="projects"></div>
      <div id="foldersBlock" hidden>
        <div class="side-title">Папки</div>
        <div id="folders"></div>
      </div>
    </div>
    <div class="side-foot">
      <button class="icon-btn" id="addBtn" title="Додати проєкт"></button>
      <button class="icon-btn" id="removeBtn" title="Прибрати проєкт зі списку (файли не видаляються)"></button>
      <span class="grow" style="flex:1"></span>
      <button class="icon-btn" id="rescanBtn" title="Перечитати папку проєкту"></button>
    </div>
  </aside>

  <section class="homepane" id="home"></section>
  <section class="list">
    <div class="toolbar">
      <button class="back-btn" id="backBtn" hidden title="Повернутись туди, звідки прийшов (Esc)"><span id="backIcon"></span>Назад</button>
      <label class="search"><span id="searchIcon"></span><input id="q" type="search" placeholder="Пошук у назвах і тексті" autocomplete="off" spellcheck="false"></label>
    </div>
    <div class="filters"><div class="seg" id="filters"></div></div>
    <div class="rows" id="rows" tabindex="0"></div>
  </section>

  <section class="detail">
    <div class="toolbar">
      <div class="save-state" id="saveState"></div>
      <div class="grow"></div>
      <button class="icon-btn" id="autoBtn" title="Автовідтворення: при переході до фрази одразу грати всі файли по черзі"></button>
      <button class="icon-btn" id="revealBtn" title="Показати у Finder"></button>
    </div>
    <div class="pane" id="pane"></div>
  </section>
</div>

<div class="sheet-back" id="sheetBack">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>Новий проєкт</h3>
    <p>Виберіть папку гри зі звуком. Позначки й коментарі збережуться в «summary.json» у цій папці (один файл на гру).</p>
    <div class="field"><label for="pName">Назва</label><input id="pName" placeholder="Наприклад, Resident Evil"></div>
    <div class="field"><label for="pPath">Папка</label>
      <div class="path-row"><input id="pPath" placeholder="/Users/…/папка" spellcheck="false"><button class="btn" id="pickBtn">Вибрати…</button></div>
    </div>
    <div class="err" id="pErr"></div>
    <div class="actions"><button class="btn" id="cancelBtn">Скасувати</button><button class="btn primary" id="okBtn">Додати</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/list.js"></script>
<script src="/static/js/player.js"></script>
<script src="/static/js/keys.js"></script>
<script src="/static/js/queue.js"></script>
<script src="/static/js/home.js"></script>
<script src="/static/js/boot.js"></script>
</body>
</html>
